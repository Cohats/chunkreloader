[[mods]]
modId="chunkreloader"
version="2.0.4"
displayName="ChunkReloader"
logoFile="chunkreloader.png"
credits=""
authors="Banana"
description='''
A mod that allows reloading (regenerating) chunks and auto-managing stale chunks.
Features:
- /reload_area command to regenerate chunks in a specified area (OP required on server)
- Auto-track and regenerate chunks not loaded for a configurable number of days
- Respects GriefDefender protected claims
- Configurable non-record area
'''

